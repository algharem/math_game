name: math_heroes
description: "أبطال الحساب - تطبيق تعليمي عربي للأطفال لتعلّم الضرب والقسمة والجمع والطرح."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.1.0
  crypto: ^3.0.5
  drift: ^2.28.2
  flutter_riverpod: ^2.6.1
  flutter_tts: ^4.0.2
  go_router: ^16.1.0
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  sqlite3_flutter_libs: ^0.5.42
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  http: ^1.2.2
  local_auth: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  drift_dev: ^2.28.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/mascot/
    - assets/images/islands/
    - assets/images/objects/
    - assets/images/badges/
    - assets/images/store/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
